---
layout: default
---

<section class="single-wrap">
  <article class="single-content" itemscope itemtype="http://schema.org/BlogPosting">
    <div class="feat">
      <h5 class="page-date">
        <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
          {{ page.date | date_to_long_string }}
        </time>
      </h5>
    </div>
    <h1 class="page-title" itemprop="name headline">{{ title }}</h1>
    <div itemprop="articleBody">
      {{ content }}
    </div>
    <div class="feat">
    </div>
    {% assign newer = collections.posts | getNextCollectionItem %}
    {% assign older = collections.posts | getPreviousCollectionItem %}
    {% if newer %}
      <a rel="next" href="{{ newer.url }}" id="next">
        <span class="nav-title nav-title-next">newer</span> &rarr;
      </a>
    {% endif %}
    {% if older %}
      <a rel="prev" href="{{ older.url }}" id="prev">
        &larr; <span class="nav-title nav-title-prev">older</span>
      </a>
    {% endif %}
  </article>
</section>
